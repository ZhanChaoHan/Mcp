spring.application.name=mcp-server

# 服务器标识
spring.ai.mcp.server.name=my-weather-server
spring.ai.mcp.server.version=1.0.0

# 服务器类型，SYNC 适合简单的请求-响应模式
spring.ai.mcp.server.type=SYNC

# 关键：启用 WebMVC 的 SSE 传输（默认就是 SSE，也可改为 STREAMABLE）
#只有服务端配置了 protocol=STREAMABLE，才能用 StreamableHttpMcpTransport 连接。如果服务端还是默认的 SSE 协议，直接用 StreamableHttpMcpTransport 会向 /sse 发 POST 请求，而 SSE 端点只接受 GET，结果就是 404
spring.ai.mcp.server.protocol=STREAMABLE

# 客户端发送消息的端点路径
#spring.ai.mcp.server.sse-message-endpoint=/mcp
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp


# 如果想同时支持 STDIO 方式（如被本地命令行工具调用），可以开启
# spring.ai.mcp.server.stdio=false